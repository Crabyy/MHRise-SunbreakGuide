<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Monster Hunter Rise: Sunbreak utility for weapon matchups, monster drops, and afflicted materials." />
  <title>MHRise: Sunbreak Utility</title>
  <link rel="icon" type="image/jpeg" href="utilityimage.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="mobile-bar">
    <div class="brand" aria-label="MHRise: Sunbreak Utility">
      <span class="brand-mark"><img src="utilityimage.jpg" alt="" /></span>
      <span class="brand-copy">
        <strong>MHRise: Sunbreak Utility</strong>
      </span>
    </div>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <aside class="sidebar">
    <div class="brand" aria-label="Sunbreak Matchups">
      <span class="brand-mark"><img src="utilityimage.jpg" alt="" /></span>
      <span class="brand-copy">
        <strong>MHRise: Sunbreak Utility</strong>
        <small>A utility that might help :P</small>
      </span>
    </div>

    <nav class="nav-groups" aria-label="Sections">
      <div class="nav-group">
        <div class="weapon-switch" id="homeSwitch" aria-label="Home"></div>
      </div>
      <div class="nav-group">
        <span class="nav-label">Weapon</span>
        <div class="weapon-switch" id="weaponSwitch" aria-label="Weapon type"></div>
      </div>
      <div class="nav-group">
        <span class="nav-label">Monster Materials</span>
        <div class="weapon-switch" id="materialsSwitch"></div>
      </div>
      <div class="nav-group">
        <span class="nav-label">App</span>
        <div class="weapon-switch" id="changelogSwitch"></div>
      </div>
    </nav>

    <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
  </aside>

  <div class="main-col">
    <main id="app" class="app-shell"></main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>Author: <a href="https://github.com/Crabyy" target="_blank" rel="noopener">Craby</a></span>
        <span id="appVersion">v1.22</span>
        <span>Monster Hunter Rise: Sunbreak &copy; Capcom &middot; Unofficial Fan Reference</span>
      </div>
    </footer>
  </div>

  <script src="data/game-data.js"></script>
  <script src="data/monster-order.js"></script>
  <script src="data/materials-data.js"></script>
  <script src="data/changelog-data.js"></script>
  <script src="data/drops-data.js"></script>
  <script src="data/small-drops-data.js"></script>
  <script src="data/small-locations-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
